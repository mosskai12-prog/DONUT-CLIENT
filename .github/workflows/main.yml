name: Build DONUT CLIENT

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - donut-client-v2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Resolve and inspect AxolotlClient rendering API
        run: |
          gradle dependencies --configuration modCompileClasspath
          AXO=$(find ~/.gradle/caches -type f -iname "*AxolotlClient-rendering*.jar" | head -n 1)
          echo "Axolotl rendering jar: $AXO"
          if [ -n "$AXO" ]; then
            jar tf "$AXO" | grep -E "GuiGraphicsExtension|\.class$" | head -80
            CLASS=$(jar tf "$AXO" | grep "GuiGraphicsExtension.class" | head -n 1 | sed "s#/#.#g; s#.class$##")
            if [ -n "$CLASS" ]; then javap -classpath "$AXO" -p "$CLASS"; fi
          fi
      - name: Build Minecraft mod
        run: gradle build
      - name: Upload DONUT CLIENT JAR
        uses: actions/upload-artifact@v4
        with:
          name: DONUT-CLIENT-1.21.11
          path: build/libs/*.jar
