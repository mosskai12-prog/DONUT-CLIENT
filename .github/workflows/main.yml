name: Build Fizzy Client

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - donut-client-v2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build Minecraft mod
        run: gradle build
      - name: Upload Fizzy Client JAR
        uses: actions/upload-artifact@v4
        with:
          name: Fizzy-Client-1.21.11
          path: build/libs/*.jar
